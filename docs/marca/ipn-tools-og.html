<!doctype html>
<!-- Banner para la vista previa de enlaces (Open Graph, 1200x630). Se genera con Chrome sin ventana:
     chrome --headless=new --window-size=1200,630 --screenshot=docs/marca/ipn-tools-og.png docs/marca/ipn-tools-og.html -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#1E1418}
.m{position:relative;width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;
  font-family:'Noto Sans',sans-serif;color:#FAF6F3;background:radial-gradient(circle at 86% 40%,#7A1E48 0,#4A1430 36%,#1E1418 74%)}
.top{display:flex;align-items:center;gap:20px}
.top img{width:92px;height:92px;border-radius:22px}
.top span{font-family:'Montserrat',sans-serif;font-weight:800;font-size:50px;letter-spacing:-1px}
h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:76px;line-height:1;letter-spacing:-2px;max-width:900px}
.sub{margin-top:18px;font-size:30px;color:#E4D6DC;font-weight:600;max-width:900px}
.row{display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:12px}
.chip{padding:8px 22px;border:2px solid #E7A9C2;border-radius:999px;font-size:24px;font-weight:600}
.u{font-size:24px;font-weight:700;color:#F3C6D8;letter-spacing:2px}
.ico{position:absolute;right:72px;top:64px;width:250px;height:250px;opacity:.95}
</style></head><body><div class="m">
<div class="top"><img src="ipn-tools-icono-512.png" alt=""><span>IPN-tools</span></div>
<img class="ico" src="ipn-tools-icono-512.png" alt="" style="display:none">
<div><h1>Arma tu horario y planea tu trayectoria</h1>
<p class="sub">Mapa curricular, avance, metas y horario sin traslapes, con tus datos del SAES.</p></div>
<div class="row"><div class="chips"><span class="chip">Libre acceso</span><span class="chip">Sin contraseñas</span></div><span class="u">UPIITA · ESCOM · UPIBI</span></div>
</div></body></html>
