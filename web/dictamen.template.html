<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dictamen UPIITA</title>
<style>/*__TOKENS__*/

/* Paleta institucional local; los tokens fijados de ipn-comun se conservan. */
:root{
  --ipn-fondo:#fafafa; --ipn-superficie:#ffffff; --ipn-hundido:#f4f4f5; --ipn-linea:#d9d9de;
  --ipn-texto:#18181b; --ipn-tenue:#52525b; --ipn-acento:#750946; --ipn-acento-fuerte:#5b1237;
  --ipn-acento-suave:#f7eef2; --ipn-ok:#15803d;
  --ipn-ok-suave:#ecfdf3; --ipn-aviso:#8a5a00; --ipn-aviso-suave:#fdf6e3; --ipn-error:#b42346;
  --ipn-error-suave:#fdecf0;
  --ipn-sobre-acento:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-tema="claro"]){
  --ipn-fondo:#09090b; --ipn-superficie:#18181b; --ipn-hundido:#111113; --ipn-linea:#323237;
  --ipn-texto:#e4e4e7; --ipn-tenue:#a1a1aa; --ipn-acento:#ec9cbf; --ipn-acento-fuerte:#f7c6db;
  --ipn-sobre-acento:#1d0a13; --ipn-acento-suave:#2e1a24;
  --ipn-ok:#6ee7a0; --ipn-ok-suave:#0f2a1c; --ipn-aviso:#f5c56b; --ipn-aviso-suave:#2f230b;
  --ipn-error:#fda4b8; --ipn-error-suave:#3a1520;
  color-scheme:dark;
}}
:root[data-tema="oscuro"]{
  --ipn-fondo:#09090b; --ipn-superficie:#18181b; --ipn-hundido:#111113; --ipn-linea:#323237;
  --ipn-texto:#e4e4e7; --ipn-tenue:#a1a1aa; --ipn-acento:#ec9cbf; --ipn-acento-fuerte:#f7c6db;
  --ipn-sobre-acento:#1d0a13; --ipn-acento-suave:#2e1a24;
  --ipn-ok:#6ee7a0; --ipn-ok-suave:#0f2a1c; --ipn-aviso:#f5c56b; --ipn-aviso-suave:#2f230b;
  --ipn-error:#fda4b8; --ipn-error-suave:#3a1520;
  color-scheme:dark;
}
:root[data-tema="claro"]{
  --ipn-fondo:#fafafa; --ipn-superficie:#ffffff; --ipn-hundido:#f4f4f5; --ipn-linea:#d9d9de;
  --ipn-texto:#18181b; --ipn-tenue:#52525b; --ipn-acento:#750946; --ipn-acento-fuerte:#5b1237;
  --ipn-acento-suave:#f7eef2; --ipn-ok:#15803d;
  --ipn-ok-suave:#ecfdf3; --ipn-aviso:#8a5a00; --ipn-aviso-suave:#fdf6e3; --ipn-error:#b42346;
  --ipn-error-suave:#fdecf0;
  --ipn-sobre-acento:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}body{margin:0;background:var(--ipn-fondo);color:var(--ipn-texto);font:var(--ipn-tamano-m)/1.5 var(--ipn-fuente-texto)}
main{max-width:64rem;margin:auto;padding:var(--ipn-esp-4)}h1{font-size:var(--ipn-tamano-xl)}h2{font-size:var(--ipn-tamano-l)}
.campos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--ipn-esp-3)}label{display:block;font-size:var(--ipn-tamano-s)}
input,select,textarea{width:100%;padding:var(--ipn-esp-2);font:inherit;color:var(--ipn-texto);background:var(--ipn-superficie);border:1px solid var(--ipn-borde-control);border-radius:var(--ipn-radio)}
textarea{min-height:6rem;resize:vertical}input[type=checkbox]{width:auto;margin-right:.5rem}.acciones{display:flex;flex-wrap:wrap;gap:var(--ipn-esp-2);margin:var(--ipn-esp-4) 0}
.ua{display:grid;grid-template-columns:1fr 3fr .8fr 1fr 1fr auto;gap:var(--ipn-esp-2);margin-bottom:var(--ipn-esp-3)}fieldset{min-width:0;border:1px solid var(--ipn-linea);margin:var(--ipn-esp-4) 0;padding:var(--ipn-esp-3)}
[hidden]{display:none!important}a{color:var(--ipn-acento)}
@media(max-width:720px){.campos{grid-template-columns:1fr}.ua{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><style>/*__COMPONENTES_CSS__*/</style>
<style>#avisos .sate-aviso__cuerpo{display:block;overflow:visible;-webkit-line-clamp:unset}</style>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head><body><!--__INST_HEADER__--><main><!--__IPNT_HOME__-->
<h1 data-t="dictamen.titulo"></h1><p data-t="dictamen.leyenda"></p><div id="avisos"></div>
<p><a href="horarios-upiita.html" data-t="dictamen.lector"></a></p>
<form id="formulario" autocomplete="off">
<h2 data-t="dictamen.datos"></h2><div id="comunes" class="campos"></div>
<h2 data-t="dictamen.formato"></h2><label><span data-t="dictamen.tipo"></span><select id="tipo"><option value="interno" data-t="dictamen.interno"></option><option value="externo" data-t="dictamen.externo"></option></select></label>
<p data-t="dictamen.privacidad"></p><div id="interno"><div id="campos-interno" class="campos"></div>
<h2 data-t="dictamen.ua"></h2><p data-t="dictamen.ua_ayuda"></p><div id="filas"></div><button type="button" id="agregar" class="sate-btn" data-t="dictamen.agregar"></button></div>
<div id="externo" hidden><div id="campos-externo" class="campos"></div><div id="opciones"></div></div>
<h2 data-t="dictamen.peticion"></h2><label><span data-t="dictamen.peticion_ayuda"></span><textarea id="peticion"></textarea></label>
<h2 data-t="dictamen.carta"></h2><p data-t="dictamen.carta_ayuda"></p><label><span data-t="dictamen.motivos"></span><textarea id="motivos"></textarea></label>
<div class="acciones"><button type="button" id="generar" class="sate-btn sate-btn--primario" data-t="dictamen.generar"></button><button type="button" id="carta" class="sate-btn" data-t="dictamen.carta_generar"></button><button type="button" id="requisitos" class="sate-btn" data-t="dictamen.requisitos"></button></div>
<p id="estado" role="status" aria-live="polite"></p></form></main>
<script>/*__TEXTO_JS__*/</script><script>/*__TEXTOS__*/</script><script>/*__COMPONENTES_JS__*/</script>
<script>
'use strict';
const DATA=/*__DATA__*/null;
Texto.registrar('es',T);const t=Texto.t;SateUI.usarTextos(t);
const $=s=>document.querySelector(s), txt=(k,v)=>t('dictamen.'+k,v);
document.querySelectorAll('[data-t]').forEach(n=>n.textContent=t(n.dataset.t));document.title=txt('titulo');
const comunes=['paterno','materno','nombres','boleta','carrera','plan','unidad','periodo','correo','telefono','celular','fecha'];
const internos=['anteriores','oficios','ingreso'];
const externos=['nacimiento','civil','domicilio','ingreso_ext','ultimo','dictamen_fecha','otras_situacion','otras_causas'];
function campo(k,valor='',tipo='text'){
  const l=document.createElement('label'),s=document.createElement('span'),n=document.createElement('input');
  s.textContent=txt(k);n.id=k;n.type=tipo;n.value=valor;l.append(s,n);return l;
}
for(const [id,campos] of [['comunes',comunes],['campos-interno',internos],['campos-externo',externos]])campos.forEach(k=>$('#'+id).append(campo(k,'',k==='fecha'||k==='nacimiento'||k==='dictamen_fecha'?'date':'text')));
$('#fecha').value=new Date().toLocaleDateString('en-CA');
const grupos={dependientes:['si','no'],hijos:['si','no'],embarazo:['propio','pareja','no_contestar'],organo:['ctce','cgc'],situacion:['s1','s2','s3','s4','s5','s6'],causas:['salud','economica','familiar','legal','laboral','administrativa','otras'],anexos:['boleta_global','probatorios','carta_anexo','otros_anexos','dictamenes','bajas']};
for(const [g,opciones] of Object.entries(grupos)){
  const f=document.createElement('fieldset'),leg=document.createElement('legend');leg.textContent=txt(g);f.append(leg);
  opciones.forEach(k=>{const l=document.createElement('label'),n=document.createElement('input');n.type=['dependientes','hijos','embarazo','organo'].includes(g)?'radio':'checkbox';n.name=g;n.value=k;l.append(n,document.createTextNode(txt(k)));f.append(l)});$('#opciones').append(f);
}
// No se puede dividir un nombre compuesto con certeza: se conserva íntegro hasta que el alumno lo confirme.
function precargar(a){
  if(!a||a.upiita_saes!==1||(a.unidad||'upiita')!=='upiita')return null;
  const v={nombres:a.nombre||'',boleta:a.boleta||'',carrera:a.carrera_nombre||'',plan:a.plan||'',unidad:'UPIITA-IPN',periodo:a.periodo_actual||a.periodo||'',correo:a.correo_institucional||a.correo||'',ultimo:a.ultimo_semestre||''};
  const aprobadas=new Set((a.acreditadas||[]).map(r=>r[0]));
  const pendientes=new Map();
  for(const r of [...(a.reprobadas_periodo||[]),...(a.desfasadas_saes||[]),...(a.kardex_reprobadas||[])]){
    if(!r||aprobadas.has(r[0]))continue;
    const k=r[0],m=DATA.materias[`${a.carrera}|${a.plan}|${k}`]||[];
    const fila=pendientes.get(k)||{clave:k,nombre:m[0]||'',nivel:m[1]||'',cursada:'',recursada:''};
    pendientes.set(k,fila);
  }
  for(const fila of pendientes.values()){
    const hist=(a.kardex_reprobadas||[]).filter(r=>r[0]===fila.clave).map(r=>periodo(r[2])).filter(Boolean);
    const fechas=[...new Set(hist)].sort((a,b)=>indice(a)-indice(b));
    fila.cursada=fechas[0]||periodo((a.reprobadas_periodo||[]).find(r=>r[0]===fila.clave)?.[1]);
    fila.recursada=fechas.length>1?fechas.slice(1).join(', '):'';
  }
  return {valores:v,filas:[...pendientes.values()]};
}
function periodo(p){const m=String(p||'').match(/^(?:20)?(\d{2})\/?([12])$/);return m?`${m[1]}/${m[2]}`:''}
function indice(p){const s=p.split('/');return +s[0]*2+(+s[1]-1)}
function filaUA(r={}){
  const d=document.createElement('div');d.className='ua';
  ['clave','nombre','nivel','cursada','recursada'].forEach(k=>{const l=campo('ua_'+k,r[k]||'');l.querySelector('input').removeAttribute('id');l.querySelector('input').dataset.ua=k;d.append(l)});
  const b=document.createElement('button');b.type='button';b.className='sate-btn';b.textContent=txt('quitar');b.onclick=()=>d.remove();d.append(b);$('#filas').append(d);
}
let alumno=null;try{alumno=JSON.parse(localStorage.getItem('saes.alumno')||'null')}catch(e){}
const pre=precargar(alumno);
if(pre){Object.entries(pre.valores).forEach(([k,v])=>$('#'+k).value=v);pre.filas.forEach(filaUA)}
// La confirmación explícita en Ventanilla prevalece sobre el nombre indiviso del SAES.
try{const compartidos=JSON.parse(localStorage.getItem('hu.tramite.datos')||'null');if(compartidos?.confirmado)for(const [k,v] of Object.entries(compartidos.datos))if(comunes.includes(k))$('#'+k).value=v}catch(e){}
$('#avisos').append(SateUI.avisos([{estado:pre?'info':'aviso',titulo:txt(pre?'revisar':'sin_datos'),cuerpo:txt(pre?'nombre_ayuda':'sin_datos_ayuda')},{estado:'aviso',titulo:txt('vigencia'),cuerpo:txt('vigencia_ayuda')}]));
$('#agregar').onclick=()=>filaUA();
$('#tipo').onchange=()=>{const interno=$('#tipo').value==='interno';$('#interno').hidden=!interno;$('#externo').hidden=interno};
function valores(){
  const v={};[...comunes,...internos,...externos,'peticion','motivos'].forEach(k=>v[k]=$('#'+k).value.trim());
  for(const g in grupos)v[g]=[...document.querySelectorAll(`input[name="${g}"]:checked`)].map(n=>n.value);
  v.filas=[...document.querySelectorAll('.ua')].map(d=>Object.fromEntries([...d.querySelectorAll('[data-ua]')].map(n=>[n.dataset.ua,n.value.trim()])));return v;
}
/*__PDF_DICTAMEN__*/
async function generar(tipo,v){return PdfDictamen.generar({tipo,valores:v,pdfs:DATA.pdfs,texto:txt})}
async function descargar(tipo){
  const estado=$('#estado');estado.textContent=txt('generando');
  try{const v=valores();v.tipo=$('#tipo').value;const bytes=await generar(tipo,v);const u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download=`dictamen-${tipo}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);estado.textContent=txt('listo')}
  catch(e){estado.textContent=e.message;console.error('Dictamen: generación fallida', {tipo,error:e.name,mensaje:e.message});SateUI.modal(txt('error'),e.message)}
}
$('#generar').onclick=()=>descargar($('#tipo').value);$('#carta').onclick=()=>descargar('carta');
$('#requisitos').onclick=()=>{const d=document.createElement('div');for(const k of ($('#tipo').value==='interno'?['llevar_interno','plazo_interno']:['llevar_externo','plazo_externo'])){const p=document.createElement('p');p.textContent=txt(k);d.append(p)}SateUI.modal(txt('requisitos'),d)};
</script></body></html>
