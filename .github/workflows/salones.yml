name: Vigilar salones UPIITA

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install pdfplumber pytest
      - name: Revisar página y calendario
        id: vigilar
        env:
          FORZAR_REVISION: ${{ github.event_name == 'workflow_dispatch' }}
        run: python tools/vigilancia_salones.py >> "$GITHUB_OUTPUT"
      - name: Descargar PDF y regenerar salones
        if: steps.vigilar.outputs.changed == 'true'
        env:
          IPNT_ESTADO: ${{ runner.temp }}
        run: python tools/semestre.py pdf --recursos "$RUNNER_TEMP/salones-pdf"
      - name: Probar datos de salones
        if: steps.vigilar.outputs.changed == 'true'
        run: python -m pytest -q tests/test_salones.py
      - name: Abrir pull request
        if: steps.vigilar.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PERIODO: ${{ steps.vigilar.outputs.periodo }}
          FECHA: ${{ steps.vigilar.outputs.fecha }}
        run: |
          archivo="data/salones_${PERIODO//\//-}.json"
          rama="automation/salones-${GITHUB_RUN_ID}"
          resumen=$(python tools/resumen_salones.py "$archivo")
          printf 'Actualización detectada en la página oficial el %s.\n\nSalones que cambiaron:\n%s\n' "$FECHA" "$resumen" > "$RUNNER_TEMP/salones-pr.md"
          git checkout -B "$rama"
          git add -- "$archivo"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Salones: actualización del $FECHA"
          git push origin "$rama"
          gh pr create --title "Salones: actualización del $FECHA" --body-file "$RUNNER_TEMP/salones-pr.md" --base "${{ github.event.repository.default_branch }}" --head "$rama"
